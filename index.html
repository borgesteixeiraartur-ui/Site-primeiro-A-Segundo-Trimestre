<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Paulo Autopeças - Memes</title>
        <style>
            header {
                background-color: beige;
                color: black;
                text-align: center;
                max-width: 800px;
                margin: 0 auto 20px auto;
                border: 5px solid rgb(214, 214, 135);
                padding: 16px;
                border-radius: 8px;
            }
            main {
                background-color: beige;
                color: black;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                border: 5px solid rgb(178, 178, 120);
                padding: 16px;
                border-radius: 8px;
            }
            article {
                display: flex;
                flex-direction: column;
                gap: 24px;
                align-items: center;
            }
            .post {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 16px;
                background-color: rgba(255, 255, 255, 0.5);
                padding: 16px;
                border-radius: 8px;
                width: 100%;
                box-sizing: border-box;
                text-align: left;
            }
            img {
                height: 100px;
                width: 100px;
                object-fit: cover;
                border-radius: 8px;
                border: 2px solid #b2b278;
            }
            .artigo-autor {
                font-weight: bold;
            }
            button {
                cursor: pointer;
                padding: 6px 12px;
                font-size: 16px;
                border: 1px solid #aaa;
                border-radius: 6px;
                background-color: #fff;
                margin-right: 8px;
                transition: background-color 0.2s;
            }
            button:hover {
                background-color: #f0f0f0;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Paulo AUTOPEÇAS</h1>
            <p>Bem-vindo ao Paulo Autopeças</p> 
        </header>
        
        <main>
            <article>
                <div class="post">
                    <!-- Imagem 1: Ferramentas e peças mecânicas -->
                    <img src="https://images.unsplash.com/photo-1530046339160-ce3e530c7d2f?auto=format&fit=crop&w=300&q=80" 
                         alt="Ferramentas e peças automotivas"
                         onerror="this.src='https://placehold.co/100x100/d6d687/000000?text=Meme+1'">
                    <div>
                        <h2>Primeira venda de memes</h2> 
                        <p>Aqui tem os melhores memes para a venda</p>
                        <p class="artigo-autor">Por: Artur Landeira</p> 
                        <button class="btn-emoji">🤠 <span>0</span></button>
                        <button class="btn-emoji">🤓 <span>0</span></button>
                    </div>
                </div>
                
                <div class="post">
                    
                    <img src="imagemblog2.jpeg" 
                         alt="Motor de carro em manutenção"
                         onerror="this.src='https://placehold.co/100x100/d6d687/000000?text=Meme+2'">
                    <div>
                        <h2>Segunda venda de memes</h2> 
                        <p>Aqui tem os melhores memes para a venda</p>
                        <p class="artigo-autor">Por: Artur Landeira</p> 
                        <button class="btn-emoji">🤠 <span>0</span></button>
                        <button class="btn-emoji">🤓 <span>0</span></button>
                    </div>
                </div>
            </article>
        </main>
        
        
    </body>
</html>
